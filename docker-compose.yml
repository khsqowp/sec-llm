version: '3.9'

networks:
  dolphin-net:
    driver: bridge
    internal: false   # pipeline → host Ollama 접근 필요

services:
  qdrant:
    image: qdrant/qdrant:latest
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: dolphin-qdrant
    networks: [dolphin-net]
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__OPTIMIZER__CPU_BUDGET: "1"
      QDRANT__OPTIMIZER__INDEXING_THRESHOLD: "50000"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null && exit 0 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: dolphin-postgres
    networks: [dolphin-net]
    environment:
      POSTGRES_DB: dolphin_brain
      POSTGRES_USER: dolphin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolphin -d dolphin_brain"]
      interval: 30s
      timeout: 5s
      retries: 5

  pipeline:
    build:
      context: ./services/pipeline
      dockerfile: Dockerfile
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: dolphin-pipeline
    networks: [dolphin-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_URL=postgresql://dolphin:${POSTGRES_PASSWORD}@postgres:5432/dolphin_brain
      - VAULT_PATH=/vault
      - STORAGE_PATH=/storage
      - INBOX_PATH=/storage/inbox
      - CONFIG_PATH=/config
      - TZ=Asia/Seoul
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      # Pipeline writes new files only; existing notes are protected by create-only code.
      - ${VAULT_PATH}:/vault
      - ./Storage:/storage
      - ./config:/config:ro
      - /tmp/dolphin_libreoffice:/tmp/libreoffice
      - ./services/pipeline/src:/app/src
      - ./data/fastembed:/root/.cache/fastembed
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  chat:
    build:
      context: ./services/chat
      dockerfile: Dockerfile
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: dolphin-chat
    networks: [dolphin-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7777:7777"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_URL=postgresql://dolphin:${POSTGRES_PASSWORD}@postgres:5432/dolphin_brain
      - CHAT_MODEL=${CHAT_MODEL}
      - VAULT_PATH=/vault
      - STORAGE_PATH=/storage
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - FASTEMBED_CACHE_PATH=/fastembed_cache
      - TZ=Asia/Seoul
      - PYTHONUNBUFFERED=1
    volumes:
      - ${VAULT_PATH}:/vault:ro
      - ./Storage:/storage
      - ./data/fastembed:/fastembed_cache
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
