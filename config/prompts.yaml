  - 모의해킹: 공격 페이로드·익스플로잇(SQL·XSS·SSRF·SSTI·역직렬화 공격 기법), WAF/필터 우회(Bypass), 웹 프록시(Burp Suite·Caido·ZAP·mitmproxy), CTF, PATT_ 파일, 침투 테스트
