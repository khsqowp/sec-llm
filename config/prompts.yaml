  ---
  이 청크에서 중요한 내용을 다음 지침에 따라 정리하세요:
  - 원문에 일본어·러시아어·중국어 등 한국어·영어 외의 문자가 있으면 해당 부분은 무시하고 한국어·영어로만 작성하세요. 단어 중간에 외국어 문자가 삽입된 경우(예: 클릭ジャ킹)도 한국어로 변환하세요(예: 클릭재킹)
  - 핵심 개념, 기법, 취약점, 절차, 수치를 빠짐없이 포함
  - CVE 번호, 기관명, 소프트웨어 버전 등 구체적 정보 보존
  - 소제목(###)과 글머리 기호로 논리적으로 구조화
  - 표나 코드 블록이 있으면 마크다운 형식으로 유지
  - 청크 내 내용만 다룸 (다른 청크 추측 금지)
  - 분량: 핵심 내용 위주로 200~500단어
  - 출력 끝에 "이 청크는...", "이 섹션은...", "위 내용은..." 같은 메타 요약 문장을 절대 추가하지 마세요

# ── 다중 청크 메타 요약 (요약·키워드·관련개념 섹션만) ─────────
summarize_meta: |
  다음은 보안 문서 "{filename}"의 청크별 요약을 합산한 내용입니다.
  전체 내용을 종합하여 메타 섹션을 작성하세요.

  {toc}
  합산 내용:
  {content}

  ---
  아래 섹션들을 작성하세요. 각 섹션은 정확한 헤더(이모지 포함)를 사용하세요.

  ## 📌 요약
  (전체 문서의 핵심 포인트 5~7개를 글머리 기호(-) 로. 구체적이고 정보가 풍부하게)

  ## ⚔️ 공격 기법 & TTP
  (합산 내용에서 언급된 공격 기법·MITRE ATT&CK 전술·악성 도구·공격 단계를 구체적으로 나열. 문서에 공격 기법이 전혀 없으면 이 섹션만 제외)

  ## 🚨 침해지표 (IOC)
  (합산 내용에서 언급된 파일 해시·악성 IP·도메인·URL·레지스트리 키·CVE를 있는 그대로 나열. 실제 IOC가 전혀 없으면 이 섹션 자체를 출력하지 마세요. "unknown", "없음" 등의 값을 출력하지 마세요.)

  ## 💡 핵심 키워드
  (문서에서 직접 다루는 핵심 기술 용어·개념 10~15개. 한 줄에 하나씩 글머리 기호(-) 사용)

  ## 🔗 관련 개념
  (💡핵심 키워드에 이미 포함된 항목은 절대 반복하지 마세요. 이 문서에서 직접 언급되거나 사용된 보안 프레임워크·표준·방법론·상위 개념만 5~8개 나열하세요. 형식: 각 항목을 "- 개념명" 형태로만 작성하세요(설명 문장 금지, "- -" 이중 대시 금지). MITRE ATT&CK는 문서에 명시적으로 언급된 경우에만 포함하세요. 문서에 언급되지 않은 MITRE ATT&CK·NIST·OWASP 등 일반 프레임워크 나열 금지. 관련 개념이 없으면 이 섹션 자체를 출력하지 마세요. unknown·없음·해당없음 등의 값을 출력하지 마세요.)

# ── 소스코드 보안 분석 ────────────────────────────────────────
summarize_code: |
  다음 {language} 소스코드를 보안 전문가 관점에서 분석하세요.

  파일명: {filename}

  소스코드:
  {content}

  ---
  아래 섹션 구조로 분석 노트를 작성하세요:

  ## 📌 요약
  (코드의 목적, 주요 기능, 보안 관련성 요약)

  ## 🔍 상세 분석
  (코드 구조, 핵심 함수·클래스, 데이터 흐름, 주요 로직 설명)

  ## ⚠️ 보안 취약점
  (발견된 보안 문제: SQL 인젝션·XSS·버퍼 오버플로우·하드코딩된 자격증명·안전하지 않은 역직렬화 등. 코드 위치와 함께 설명. 없으면 "취약점 없음"으로 표기)

  ## 🔧 개선 권고사항
  (취약점 수정 방안, 시큐어 코딩 가이드라인, 리팩토링 제안)

  ## 💡 핵심 키워드
  (사용 언어·프레임워크·라이브러리, 취약점 유형, 보안 패턴)

  ## 🔗 관련 개념
  (관련 CWE·OWASP 카테고리·보안 표준)

