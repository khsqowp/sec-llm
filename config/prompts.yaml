  ## 🔍 품질 이슈
  (링크가 없는 고립된 노트, 내용이 부실하거나 중복된 노트, 빈 카테고리)

  ## 📁 구조 개선 제안
  (병합하면 좋을 유사 카테고리, 분리가 필요한 너무 큰 카테고리, 신규 카테고리 제안)

