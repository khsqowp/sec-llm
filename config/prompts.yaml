suggest_links: |
  새로 작성된 보안 노트와 기존 노트 목록을 비교하여 관련성이 높은 노트를 추천하세요.

  현재 노트 내용:
  {current_content}

  기존 노트 목록:
  {existing_notes}

  ---
  위 기존 노트 목록에서 현재 노트와 주제·개념·기술이 유사하거나 상호보완적인 노트를 최대 5개 선택하세요.

  규칙:
  - 반드시 위 기존 노트 목록에 있는 노트만 선택 (새로운 노트 생성 금지)
  - 직접적으로 연관된 노트만 선택 (억지로 5개를 채우지 않음)
  - 관련 노트가 없으면 아무것도 출력하지 않음

  관련 노트를 아래 형식으로만 출력하세요 (다른 텍스트 없이):
