summarize_single: |
  다음 보안 문서를 분석하여 완성된 마크다운 지식 노트를 작성하세요.

  파일명: {filename}
  {toc}
  문서 내용:
  {content}

  ---
  아래 섹션 구조로 노트를 작성하세요.
  각 섹션은 반드시 지정된 헤더를 정확히 사용하세요.
  보안 문서가 아니거나 해당 내용이 없으면 ⚔️ TTP와 🚨 IOC 섹션은 생략 가능합니다.
  원문에 일본어·러시아어·중국어 등 한국어·영어 외의 문자가 섞여 있으면 해당 부분은 무시하고 한국어·영어로만 작성하세요. 단어 중간에 외국어 문자가 삽입된 경우(예: 클릭ジャ킹)도 한국어로 변환하세요(예: 클릭재킹).

  ## 📌 요약
  (문서 전체를 3~5개 핵심 포인트로 요약. 글머리 기호(-) 사용. 구체적 수치·기관명·기술명 포함)

  ## ⚔️ 공격 기법 & TTP
  (문서에서 언급된 공격 기법·MITRE ATT&CK 전술·악성 도구·공격 단계를 구체적으로 나열. 문서에 공격 기법이 전혀 없으면 이 섹션 자체를 출력하지 마세요. "unknown", "없음" 등의 값을 출력하지 마세요.)

  ## 🚨 침해지표 (IOC)
  (문서에서 언급된 파일 해시·악성 IP·도메인·URL·레지스트리 키·CVE를 있는 그대로 나열. 실제 IOC가 전혀 없으면 이 섹션 자체를 출력하지 마세요. "unknown", "없음" 등의 값을 출력하지 마세요.)

  ## 🔍 상세 내용
  (문서의 핵심 내용을 소제목·단락·표·목록으로 구체적으로 정리. 원문의 중요한 수치·사례·절차를 보존)

  ## 💡 핵심 키워드
  (이 문서에서 직접 다루는 핵심 기술 용어·개념 10~15개. 한 줄에 하나씩 글머리 기호(-) 사용)

  ## 🔗 관련 개념
  (💡핵심 키워드에 이미 포함된 항목은 절대 반복하지 마세요. 이 문서에서 직접 언급되거나 사용된 보안 프레임워크·표준·방법론·상위 개념만 5~8개 나열하세요. 형식: 각 항목을 "- 개념명" 형태로만 작성하세요(설명 문장 금지, "- -" 이중 대시 금지). MITRE ATT&CK는 문서에 명시적으로 언급된 경우에만 포함하세요. 문서에 언급되지 않은 MITRE ATT&CK·NIST·OWASP 등 일반 프레임워크 나열 금지. 관련 개념이 없으면 이 섹션 자체를 출력하지 마세요. unknown·없음·해당없음 등의 값을 출력하지 마세요.)

