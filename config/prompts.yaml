# 모델: Qwen2.5-Coder-14B-Instruct-Uncensored (Q4_K_M)
# 언어: 한국어 우선, 영문 기술 용어 허용
# ============================================================

# ── 시스템 프롬프트 (모든 LLM 호출에 공통 적용) ─────────────
system: |
  당신은 한국의 정보보안 전문가로서 보안 문서와 기술 자료를 체계적으로 분석하고 구조화된 지식 베이스를 구축하는 AI입니다.

  핵심 원칙:
  - 모든 분석과 출력은 한국어로 작성합니다 (기술 용어·고유명사·CVE 등은 영문 유지)
  - 요청된 출력 형식을 100% 정확히 따릅니다
  - 인사말, 사과, 부연 설명 없이 지시된 결과만 출력합니다
  - 내용이 없거나 불명확한 경우에도 추측하지 않고 "unknown"으로 표기합니다
  - 환각(hallucination) 없이 문서에 실제로 존재하는 내용만 기술합니다

# ── 도메인 분류 (단답) ────────────────────────────────────────
classify: |
  다음 파일을 분석하여 가장 적합한 보안 도메인 하나를 선택하세요.

  ⚠️ [절대 규칙 — 도메인 기준보다 최우선 적용]
  - 파일명이 'PATT_'로 시작하면 → 무조건 모의해킹 (내용·키워드 무관, 예외 없음)
    예시: PATT_API_Key_Leaks → 모의해킹 / PATT_SQLi_Identify → 모의해킹 / PATT_XSS_Summary → 모의해킹
    이유: PATT_는 PayloadAllTheThings 공격 페이로드 레퍼런스로, 'Identify'·'Summary'·'References'가 파일명에 있어도 진단 문서가 아닌 공격 기법 자료입니다.

  [도메인 선택 기준]
  - 관제: 보안 트렌드 리포트(EQST Insight·KARA 시리즈 등), 침해사고 분석, 위협 인텔리전스, SOC/SIEM 운영, 랜섬웨어·APT 동향 보고서, 연간 보안 위협 전망
  - 네트워크: TCP/IP 프로토콜, 방화벽·IDS/IPS·VPN 설정, 패킷 분석·Wireshark, 라우팅·스위칭, 네트워크 보안 설계
  - 리눅스: 리눅스 시스템 관리, 셸 스크립트, 서버 보안 강화, 권한 상승 기법, 리눅스 취약점
  - AWS: AWS 전용 서비스(EC2·S3·IAM·Lambda·CloudTrail·GuardDuty·EKS 등)를 직접 다루는 클라우드 보안 자료. Azure나 GCP만 다루는 문서는 이 도메인으로 분류하지 마세요
  - 모의해킹: 공격 페이로드·익스플로잇 코드(SQL 인젝션·XSS·CSRF·SSRF·SSTI·역직렬화 공격 기법), WAF/필터 우회 기법(Bypass), 웹 프록시(Burp Suite·Caido·ZAP·mitmproxy), 칼리 리눅스, CTF 풀이, 침투 테스트 방법론, PATT_(PayloadAllTheThings) 파일
  - 취약점진단: ISMS·ISMS-P 인증, 기술적 취약점 분석·평가 방법 상세 가이드, 주요정보통신기반시설 보안점검, IoT·WAS·클라우드 진단 가이드, LLM 취약점 진단, 보안 점검 체크리스트, 컴플라이언스 (공격 페이로드보다 진단 방법론·체크리스트·가이드 중심)
  - 소스코드진단: 소스코드 보안 취약점 검토, SAST 도구, 시큐어 코딩 가이드, 정적·동적 분석, 코드 리뷰 방법론
  - 암호학: 암호 알고리즘(AES·RSA·ECC·ChaCha20), PKI, TLS/SSL, 해시 함수, 디지털 서명, 키 교환 프로토콜
  - 리버싱: 리버스 엔지니어링, 바이너리 분석, 악성코드 분석, IDA Pro·Ghidra, 디버거, 디스어셈블리, 패킹·언패킹
  - 모바일진단: iOS·Android 앱 보안, APK·IPA 분석, 모바일 침투 테스트, 모바일 보안 솔루션 우회
  - 아이디어: 연구 아이디어, 개인 기획·메모, 학습 로드맵 (기술 문서·보고서가 아닌 경우)
  - 스크랩: 위 도메인 중 어디에도 명확히 해당하지 않는 자료

  선택 가능 도메인: {domains}

  파일명: {filename}

  내용:
  {content}

  ---
  위 내용을 분석하여 가장 적합한 도메인 하나만 출력하세요.
  도메인명만 출력 (다른 텍스트 없이):

