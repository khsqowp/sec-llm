evaluate_folder_merge: |
  두 아이디어 폴더의 내용을 비교하여 하나로 합병할지 판단하세요.

  폴더 A: {name_a}
  샘플 내용:
  {sample_a}

  폴더 B: {name_b}
  샘플 내용:
  {sample_b}

  ---
  두 폴더의 주제가 충분히 유사하여 합병해도 정보 손실이 없는지 판단하세요.
  보수적으로 판단하세요: 확실히 같은 주제일 때만 합병을 권장합니다.

  반드시 아래 JSON 형식으로만 출력하세요 (다른 텍스트 없이):
  {"should_merge": true, "merged_name": "합병 후 폴더명", "reason": "판단 이유"}

  또는:
  {"should_merge": false, "merged_name": "", "reason": "판단 이유"}
