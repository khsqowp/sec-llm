  [메타데이터 추출 기준]
  - doc_date: 문서 작성·발행 연월 (YYYY-MM 형식). 연도만 있으면 YYYY-01. 없으면 unknown
  - version: 문서 버전 (예: "2.0", "v1.3"). 없으면 unknown
  - organization: 발행 기관·회사·개인 (예: "SK쉴더스", "KISA", "개인"). 없으면 unknown
  - doc_type: 보고서 | 가이드 | 매뉴얼 | 연구논문 | 기술문서 | 점검표 | 슬라이드 중 택일
  - cves: 언급된 CVE 번호 목록 (예: [CVE-2023-1234, CVE-2024-5678]). 없으면 []
  - cwes: 언급된 CWE 번호 목록. 공격 유형별 올바른 CWE를 선택하세요:
    XSS(크로스사이트스크립팅) → CWE-79(XSS 전용; LFI/파일인클루전·ViewState 등에는 절대 사용 금지),
    SQL인젝션 → CWE-89, SSTI(템플릿인젝션) → CWE-94,
    역직렬화 → CWE-502, SSRF → CWE-918, 경로순회 → CWE-22,
    파일인클루전(LFI/RFI) → CWE-98, XXE → CWE-611, 인증우회 → CWE-287,
    IDOR → CWE-639, 명령주입 → CWE-77/78, 버퍼오버플로 → CWE-120.
    문서에 실제로 언급되거나 명백히 해당되는 경우만 포함. 없으면 []
  - affected_systems: 영향 받는 OS·소프트웨어·장비 목록 (예: [Windows 10, Apache 2.4]). 없으면 []

  파일명: {filename}

